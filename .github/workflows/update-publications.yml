name: Update publications from ORCID

on:
  schedule:
    - cron: "23 6 * * 1"   # every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add new ORCID articles
        run: python scripts/update_publications.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data/new-publications.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Add new publications from ORCID"
            git pull --rebase
            git push
          fi

