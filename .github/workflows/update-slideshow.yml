name: Update slideshow

on:
  push:
    paths:
      - "images/slideshow/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-slideshow
  cancel-in-progress: false

jobs:
  slideshow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install "pillow>=10,<13"

      - name: Build slideshow list and shrink large pictures
        run: python scripts/build_slides.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/slides.json images/slideshow images/slideshow-sizes
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update slideshow list"
            git pull --rebase
            git push
          fi
