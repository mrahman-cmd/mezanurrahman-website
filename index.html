<script>
  /*
    SINGLE-FILE WEBSITE SCRIPT

    - Removes the Opportunities section and associated navigation link.
    - Loads current peer-reviewed plant abiotic-stress research directly.
    - Uses Crossref first, then OpenAlex as a fallback.
    - Does not use localStorage, data/plant-news.json, GitHub Actions,
      university-news pages, conference announcements, or job advertisements.
  */

  /* Remove old opportunities / live-events content */

  document
    .querySelector('a[href="#opportunities"]')
    ?.closest("li")
    ?.remove();

  document.getElementById("opportunities")?.remove();

  /* Mobile navigation */

  const menuButton = document.getElementById("menu-button");
  const navigationMenu = document.getElementById("primary-navigation");

  if (menuButton && navigationMenu) {
    menuButton.addEventListener("click", function () {
      const menuIsOpen = navigationMenu.classList.toggle("open");

      menuButton.setAttribute("aria-expanded", String(menuIsOpen));
      menuButton.textContent = menuIsOpen ? "Close" : "Menu";
    });

    document.querySelectorAll("#primary-navigation a").forEach(function (link) {
      link.addEventListener("click", function () {
        if (window.innerWidth <= 950) {
          navigationMenu.classList.remove("open");
          menuButton.setAttribute("aria-expanded", "false");
          menuButton.textContent = "Menu";
        }
      });
    });

  const STRESS_TERMS = [
    "abiotic stress",
    "drought",
    "water deficit",
    "dehydration",
    "heat stress",
    "heat tolerance",
    "heat resilience",
    "salinity",
    "salt stress",

    "submergence",
    "cold stress",
    "cold tolerance",
    "chilling",
    "freezing",
    "temperature stress",
    "thermal stress",
    "osmotic stress",
    "stress tolerance",
    "stress resilience",
    "climate resilience",
    "climate adaptation"
  ];

  const PLANT_TERMS = [
    "plant",
    "crop",
    "rice",
    "wheat",
    "maize",
    "corn",
    "soybean",
    "barley",
    "sorghum",
    "tomato",
    "cotton",
    "potato",
    "arabidopsis",
    "populus",
    "tree",
    "root",
    "leaf",
    "stomata",
    "photosynthesis",
    "seed",
    "germination",
    "chlorophyll",
    "phytohormone"
  ];

  const EXCLUDED_TERMS = [
    "editorial",
    "correction",
    "corrigendum",
    "retraction",
    "erratum",
    "obituary",
    "memoriam",
    "conference",
    "congress",
    "symposium",
    "webinar",
    "job",
    "vacancy",
    "position available",
    "call for papers",
    "degree",
    "student",
    "program",
    "fellowship",
    "bibliometric",
    "systematic review",
    "meta-analysis"
  ];

  function cleanText(value) {
    if (!value) {
      return "";
    }

    return String(value)
      .replace(/<[^>]*>/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function normaliseText(value) {
    return cleanText(value)
      .toLowerCase()
      .replace(/&/g, "and")
      .replace(/[^\w\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function hasAnyTerm(text, terms) {
    return terms.some(function (term) {
      return text.includes(term);
    });
  }

  function getCutoffDate() {
    const date = new Date();
    date.setDate(date.getDate() - DAYS_BACK);

    return date.toISOString().slice(0, 10);
  }

  function formatNewsDate(dateValue) {
    if (!dateValue) {
      return "Recent Research";
    }

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
      return "Recent Research";
    }

    return date.toLocaleDateString("en-US", {
      year: "numeric",
      month: "short",
      day: "numeric"
    });
  }

  function crossrefDateToISO(item) {
    const possibleFields = [
      "published-online",
      "published-print",
      "published",
      "issued",
      "created"
    ];

    for (const field of possibleFields) {
      const dateParts = item[field]?.["date-parts"];

      if (
        Array.isArray(dateParts) &&
        Array.isArray(dateParts[0]) &&
        dateParts[0].length
      ) {
        const parts = dateParts[0];
        const year = Number(parts[0]);
        const month = Number(parts[1] || 1);
        const day = Number(parts[2] || 1);

        if (year) {
          return new Date(
            Date.UTC(year, month - 1, day)
          ).toISOString();
        }
      }
    }

    return "";
  }

  function articleIsRelevant(title, journal) {
    const lowerTitle = normaliseText(title);

    if (!lowerTitle) {
      return false;
    }

    if (hasAnyTerm(lowerTitle, EXCLUDED_TERMS)) {
      return false;
    }

    if (!hasAnyTerm(lowerTitle, STRESS_TERMS)) {
      return false;
    }

    /*
      General-science journals require explicit plant or crop context.
      Specialist plant journals are already plant-focused.
    */
    if (journal.general && !hasAnyTerm(lowerTitle, PLANT_TERMS)) {
      return false;
    }

    return true;
  }

  function getRelevanceScore(article) {
    const title = normaliseText(article.title);
    let score = article.priority;

    STRESS_TERMS.forEach(function (term) {
      if (title.includes(term)) {
        score += 5;
      }
    });

    PLANT_TERMS.forEach(function (term) {
      if (title.includes(term)) {
        score += 2;
      }
    });

    return score;
  }

  function isSelectedJournal(sourceName) {
    const source = normaliseText(sourceName);

    return JOURNALS.some(function (journal) {
      return normaliseText(journal.name) === source;
    });
  }

  function getJournalInformation(sourceName) {
    const source = normaliseText(sourceName);

    return (
      JOURNALS.find(function (journal) {
        return normaliseText(journal.name) === source;
      }) || null
    );
  }

  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();

    const timeout = setTimeout(function () {
      controller.abort();
    }, timeoutMs);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Request failed with status " + response.status);
      }

      return response;
    } finally {
      clearTimeout(timeout);
    }
  }

  async function fetchCrossrefJournal(journal) {
    const parameters = new URLSearchParams({
      filter:
        "from-pub-date:" +
        getCutoffDate() +
        ",type:journal-article",
      sort: "published",
      order: "desc",
      rows: "60",
      select: [
        "DOI",
        "title",
        "container-title",
        "published",
        "published-online",
        "published-print",
        "issued",
        "URL"
      ].join(",")
    });

    const url =
      "https://api.crossref.org/journals/" +
      encodeURIComponent(journal.issn) +
      "/works?" +
      parameters.toString();

    const response = await fetchWithTimeout(url, 12000);
    const data = await response.json();

    return {
      journal: journal,
      items: data.message?.items || []
    };
  }

  async function getCrossrefArticles() {
    const results = await Promise.allSettled(
      JOURNALS.map(function (journal) {
        return fetchCrossrefJournal(journal);
      })
    );

    const articles = [];
    const seen = new Set();

    results.forEach(function (result) {
      if (result.status !== "fulfilled") {
        return;
      }

      const journal = result.value.journal;

      result.value.items.forEach(function (item) {
        const title = cleanText(item.title?.[0]);
        const doi = cleanText(item.DOI);
        const link = doi
          ? "https://doi.org/" + doi
          : cleanText(item.URL);

        if (!title || !link || !articleIsRelevant(title, journal)) {
          return;
        }

        const identifier = doi
          ? doi.toLowerCase()
          : title.toLowerCase();

        if (seen.has(identifier)) {
          return;
        }

        seen.add(identifier);

        const source =
          cleanText(item["container-title"]?.[0]) || journal.name;

        const article = {
          title: title,
          source: source,
          link: link,
          pubDate: crossrefDateToISO(item),
          priority: journal.priority,
          provider: "Crossref",
          summary:
            "Peer-reviewed research related to plant abiotic stress, stress tolerance, or climate resilience."
        };

        article.score = getRelevanceScore(article);
        articles.push(article);
      });
    });

    return articles;
  }

  async function fetchOpenAlexQuery(searchQuery) {
    const parameters = new URLSearchParams({
      search: searchQuery,
      filter:
        "from_publication_date:" +
        getCutoffDate() +
        ",type:article",
      sort: "publication_date:desc",
      per_page: "100",
      mailto: "mrahman@gau.edu.bd"
    });

    const url =
      "https://api.openalex.org/works?" +
      parameters.toString();

    const response = await fetchWithTimeout(url, 12000);
    const data = await response.json();

    return data.results || [];
  }

  async function getOpenAlexArticles() {
    const queries = [
      "plant drought stress",
      "plant heat salinity stress",
      "plant waterlogging flooding cold stress",
      "plant abiotic stress tolerance"
    ];

    const results = await Promise.allSettled(
      queries.map(function (query) {
        return fetchOpenAlexQuery(query);
      })
    );

    const articles = [];
    const seen = new Set();

    results.forEach(function (result) {
      if (result.status !== "fulfilled") {
        return;
      }

      result.value.forEach(function (item) {
        const title = cleanText(item.title);

        const source =
          cleanText(item.primary_location?.source?.display_name) ||
          cleanText(item.locations?.[0]?.source?.display_name);

        const journal = getJournalInformation(source);

        if (
          !title ||
          !source ||
          !journal ||
          !isSelectedJournal(source) ||
          !articleIsRelevant(title, journal)
        ) {
          return;
        }

        const doi = cleanText(item.doi).replace(/^https?:\/\/doi\.org\//i, "");

        const link = doi
          ? "https://doi.org/" + doi
          : cleanText(item.primary_location?.landing_page_url) ||
            cleanText(item.id);

        const identifier = doi
          ? doi.toLowerCase()
          : title.toLowerCase();

        if (!link || seen.has(identifier)) {
          return;
        }

        seen.add(identifier);

        const article = {
          title: title,
          source: source,
          link: link,
          pubDate: item.publication_date || "",
          priority: journal.priority,
          provider: "OpenAlex",
          summary:
            "Peer-reviewed research related to plant abiotic stress, stress tolerance, or climate resilience."
        };

        article.score = getRelevanceScore(article);
        articles.push(article);
      });
    });

    return articles;
  }

  function sortAndLimitArticles(articles) {
    return articles
      .sort(function (first, second) {
        const firstDate = new Date(
          first.pubDate || "1900-01-01"
        ).getTime();

        const secondDate = new Date(
          second.pubDate || "1900-01-01"
        ).getTime();

        const dateDifference = secondDate - firstDate;

        if (dateDifference !== 0) {
          return dateDifference;
        }

        return second.score - first.score;
      })
      .slice(0, MAX_ARTICLES);
  }

  function createNewsCard(article) {
    const card = document.createElement("article");
    card.className = "news-card";

    const meta = document.createElement("p");
    meta.className = "news-card-meta";
    meta.textContent =
      article.source + " · " + formatNewsDate(article.pubDate);

    const title = document.createElement("h3");

    const titleLink = document.createElement("a");
    titleLink.href = article.link;
    titleLink.target = "_blank";
    titleLink.rel = "noopener noreferrer";
    titleLink.textContent = article.title;

    title.appendChild(titleLink);

    const summary = document.createElement("p");
    summary.className = "news-summary";
    summary.textContent = article.summary;

    const readLink = document.createElement("p");
    readLink.className = "news-read-link";
    readLink.textContent = "Read the original research article →";

    card.appendChild(meta);
    card.appendChild(title);
    card.appendChild(summary);
    card.appendChild(readLink);

    return card;
  }

  function addRefreshButton() {
    const title = document.querySelector("#plant-news .section-title");

    if (!title || document.getElementById("refresh-news-button")) {
      return;
    }

    const button = document.createElement("button");
    button.id = "refresh-news-button";
    button.className = "refresh-news-button";
    button.type = "button";
    button.textContent = "↻ Refresh discoveries";

    button.style.marginBottom = "18px";
    button.style.padding = "10px 16px";
    button.style.border = "2px solid #005f91";
    button.style.background = "#ffffff";
    button.style.color = "#005f91";
    button.style.cursor = "pointer";
    button.style.fontFamily = "inherit";
    button.style.fontSize = "0.94rem";
    button.style.fontWeight = "800";

    title.insertAdjacentElement("afterend", button);

    button.addEventListener("click", function () {
      loadPlantAbioticStressNews();
    });
  }

  async function loadPlantAbioticStressNews() {
    const ticker = document.getElementById("plant-news-ticker");
    const grid = document.getElementById("plant-news-grid");
    const status = document.getElementById("plant-news-status");
    const button = document.getElementById("refresh-news-button");

    if (!ticker || !grid || !status) {
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = "Loading discoveries...";
    }

    ticker.textContent =
      "Searching selected peer-reviewed plant-science journals...";

    grid.innerHTML =
      '<div class="news-empty">Retrieving current peer-reviewed plant abiotic-stress research...</div>';

    try {
      /*
        First attempt: Crossref metadata.
      */
      let articles = await getCrossrefArticles();

      /*
        Fallback: OpenAlex scholarly-work metadata if Crossref is unavailable
        or returns too few qualifying selected-journal articles.
      */
      let provider = "Crossref";

      if (articles.length < 3) {
        const openAlexArticles = await getOpenAlexArticles();

        if (openAlexArticles.length > articles.length) {
          articles = openAlexArticles;
          provider = "OpenAlex";
        }
      }

      articles = sortAndLimitArticles(articles);

      if (!articles.length) {
        throw new Error("No qualifying journal articles were found.");
      }

      ticker.innerHTML = "";

      articles.forEach(function (article) {
        const tickerLink = document.createElement("a");

        tickerLink.href = article.link;
        tickerLink.target = "_blank";
        tickerLink.rel = "noopener noreferrer";
        tickerLink.textContent =
          "🌿 " + article.title + " — " + article.source;

        ticker.appendChild(tickerLink);
      });

      grid.innerHTML = "";

      articles.slice(0, 6).forEach(function (article) {
        grid.appendChild(createNewsCard(article));
      });

      status.textContent =
        articles.length +
        " current selected-journal plant abiotic-stress research records loaded from " +
        provider +
        " at " +
        new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        }) +
        ".";

      const sectionText = document.querySelector(
        "#plant-news .section-text"
      );

      if (sectionText) {
        sectionText.textContent =
          "Current peer-reviewed research records are retrieved live from selected plant-science and general-science journals. The feed is limited to plant or crop abiotic-stress, stress-tolerance, and climate-resilience research.";
      }

      const sourceNote = document.querySelector(
        "#plant-news .news-source-note"
      );

      if (sourceNote) {
        sourceNote.innerHTML =
          "<strong>Research-discovery feed:</strong> Live metadata are retrieved from Crossref, with OpenAlex used only as a scholarly-metadata fallback if Crossref is temporarily unavailable. The feed excludes university news, conferences, calls for papers, jobs, student programs, editorials, corrections, and general non-research headlines.";
      }

    } catch (error) {
      console.error("Plant research discovery feed error:", error);

      ticker.innerHTML = "";

      const fallbackLink = document.createElement("a");
      fallbackLink.href =
        "https://search.crossref.org/?q=plant%20abiotic%20stress";
      fallbackLink.target = "_blank";
      fallbackLink.rel = "noopener noreferrer";
      fallbackLink.textContent =
        "🌿 Live scholarly metadata are temporarily unavailable. Search Crossref for plant abiotic-stress research →";

      ticker.appendChild(fallbackLink);

      grid.innerHTML =
        '<div class="news-empty">Live research metadata could not be retrieved from either Crossref or OpenAlex at this moment. Please use the refresh button or reload the webpage.</div>';

      status.textContent =
        "Live scholarly research feed temporarily unavailable.";
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = "↻ Refresh discoveries";
      }
    }
  }

  addRefreshButton();
  loadPlantAbioticStressNews();

    },

    },

  const countryList = document.getElementById("collaborator-country-list");

  if (countryList) {
    collaboratorCountries.forEach(function (site) {
      const countryItem = document.createElement("li");
      countryItem.textContent = site.country;
      countryList.appendChild(countryItem);
    });
  }

  if (
    typeof L !== "undefined" &&
    document.getElementById("collaborator-map")
  ) {
    const collaboratorMap = L.map("collaborator-map", {
      scrollWheelZoom: false,
      zoomControl: true,
      worldCopyJump: true
    });

    collaboratorMap.setView([22, 20], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      minZoom: 2,
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
    }).addTo(collaboratorMap);

    const markerColours = {
      primary: "#a8460a",
      collaboration: "#0077b6"
    };

    const collaboratorBounds = L.latLngBounds([]);

    collaboratorCountries.forEach(function (site) {
      const marker = L.circleMarker(
        [site.latitude, site.longitude],
        {
          radius: site.category === "primary" ? 10 : 8,
          color: "#ffffff",
          weight: 3,
          fillColor: markerColours[site.category],
          fillOpacity: 1
        }
      ).addTo(collaboratorMap);

      marker.bindPopup(
        "<strong>" + site.country + "</strong><br><br>" +
        "<strong>" + site.role + "</strong><br><br>" +
        site.focus
      );

      collaboratorBounds.extend([site.latitude, site.longitude]);
    });

    function fitCollaboratorMap() {
      collaboratorMap.invalidateSize();

      if (collaboratorCountries.length > 0) {
        collaboratorMap.fitBounds(collaboratorBounds, {
          padding: [55, 55],
          maxZoom: 2
        });
      }
    }

    window.addEventListener("load", function () {
      setTimeout(fitCollaboratorMap, 500);
    });

    window.addEventListener("resize", function () {
      collaboratorMap.invalidateSize();
    });
  }
</script>
